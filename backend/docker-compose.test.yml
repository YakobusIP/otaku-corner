services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: otaku
      POSTGRES_PASSWORD: otaku
      POSTGRES_DB: otaku_corner_test
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U otaku -d otaku_corner_test"]
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "63799:6379"
